name: mailbox

x-app: &app
  build: .
  image: django-mailbox:latest
  env_file: .env
  environment:
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    MEDIA_ROOT: /app/media
  volumes:
    - media:/app/media
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mailbox}
      POSTGRES_USER: ${POSTGRES_USER:-mailbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mailbox}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  web:
    <<: *app
    command: ["web"]
    ports:
      - "${MAILBOX_PORT:-8000}:8000"
    volumes:
      - media:/app/media
      # SSH key used by the admin panel to create Linux users (see .env.example)
      - ./ssh:/app/ssh:ro
    extra_hosts:
      # lets LINUX_SSH_HOST=host.docker.internal reach the machine Docker runs on
      - "host.docker.internal:host-gateway"

  worker:
    <<: *app
    command: ["worker"]
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  pgdata:
  media:
